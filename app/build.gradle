plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hb.chargeinfo'
    compileSdk 34

    defaultConfig {
        applicationId "com.hb.chargeinfo"
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}
